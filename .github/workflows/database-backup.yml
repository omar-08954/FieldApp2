name: Database backup

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump-to-supabase-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_BACKUPS_BUCKET: ${{ secrets.SUPABASE_BACKUPS_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - name: Create encrypted-in-transit PostgreSQL dump
        run: |
          set -euo pipefail
          backup="fieldapp-$(date -u +%F).dump"
          pg_dump --format=custom --no-owner --no-privileges --file "$backup" "$DATABASE_URL"
      - name: Upload separate backup copy to Supabase Storage
        run: |
          set -euo pipefail
          backup="fieldapp-$(date -u +%F).dump"
          curl --fail-with-body --retry 3 \
            -X POST "$SUPABASE_URL/storage/v1/object/$SUPABASE_BACKUPS_BUCKET/postgres/$backup" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/octet-stream" \
            -H "x-upsert: true" \
            --data-binary "@$backup"
